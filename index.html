<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-dark: #000000;
            --panel-bg: #1c2026;
            --border-color: #2f3640;
            --accent-gold: #c5a059;
            --text-main: #c5a059;
            --text-muted: #718093;
            
            /* Position Colors */
            --pos-qb: #fc778b;
            --pos-rb: #5cab7d;
            --pos-wr: #2980b9;
            --pos-te: #fca335;
            --pos-k: #9c5bbd;
            --pos-def: #946448;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cinzel', serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }
        header h1 { color: #c5a059; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Horizontal Control Panel */
        .control-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .console-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .clock-box {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 6px;
            text-align: center;
        }
        .clock-box .on-clock-team { font-size: 0.9rem; font-weight: bold; color: #c5a059; }
        
        .form-group { position: relative; min-width: 300px; }
        .form-group label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 3px; font-weight: 700; }
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: #ffffff;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        /* Autocomplete Suggestions Box */
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-dark);
            border: 1px solid var(--accent-gold);
            border-top: none;
            max-height: 220px;
            overflow-y: auto;
            z-index: 99;
            border-radius: 0 0 4px 4px;
        }
        .autocomplete-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }
        .autocomplete-item:hover { background: rgba(243, 156, 18, 0.2); }
        .item-meta { color: var(--text-muted); font-size: 0.7rem; }

        .console-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .selected-preview {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            min-width: 200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-action-group {
            display: flex;
            gap: 8px;
        }
        .btn-draft {
            padding: 9px 16px;
            background: var(--accent-gold);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: opacity 0.2s;
        }
        .btn-draft:hover { opacity: 0.9; }
        .btn-draft:disabled { background: var(--text-muted); cursor: not-allowed; }

        .btn-undo {
            padding: 9px 14px;
            background: #c0392b;
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: opacity 0.2s;
        }
        .btn-undo:hover { opacity: 0.9; }
        .btn-undo:disabled { background: var(--border-color); color: var(--text-muted); cursor: not-allowed; }

        /* Draft Board Grid */
        .board-wrapper {
            overflow-x: auto;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }
        .draft-grid {
            display: grid;
            grid-template-columns: repeat(12, 120px);
            gap: 8px;
        }
        .team-header {
            background: var(--bg-dark);
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 0.8rem;
            border-bottom: 3px solid var(--accent-gold);
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            outline: none;
        }
        .team-header:focus { border-bottom-color: var(--text-main); background: #1a1e24; }
        
        .draft-cell {
            background: var(--bg-dark);
            border: 1px dashed var(--border-color);
            height: 75px;
            border-radius: 4px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 0.7rem;
        }
        .draft-cell.filled {
            border: 1px solid rgba(255,255,255,0.2);
            border-style: solid;
        }
        .pick-number {
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        .draft-cell.filled .pick-number { color: rgba(255,255,255,0.7); }

        .player-info {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pos-badge {
            align-self: flex-start;
            font-size: 0.55rem;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
            color: white;
            background: rgba(0, 0, 0, 0.3);
        }

        /* Full cell position background color fills */
        .fill-qb { background-color: var(--pos-qb) !important; color: #fff; }
        .fill-rb { background-color: var(--pos-rb) !important; color: #fff; }
        .fill-wr { background-color: var(--pos-wr) !important; color: #fff; }
        .fill-te { background-color: var(--pos-te) !important; color: #fff; }
        .fill-k  { background-color: var(--pos-k) !important; color: #fff; }
        .fill-def { background-color: var(--pos-def) !important; color: #fff; }
    </style>
</head>

      function buildGridStructure() {
    const grid = document.getElementById('draft-grid');
    grid.innerHTML = '';

    teams.forEach((team, index) => {
        const header = document.createElement('div');
        header.className = 'team-header';
        header.contentEditable = true;
        header.innerText = team;
        
        header.onblur = (e) => { 
            updateTeamName(index, e.target.innerText); 
        };
        header.onkeydown = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                header.blur();
            }
        };

        grid.appendChild(header);
    });

    for (let r = 0; r < totalRounds; r++) {
        for (let t = 0; t < totalTeams; t++) {
            // Standard left-to-right visual placement per cell column
            const cell = document.createElement('div');
            cell.className = 'draft-cell';
            cell.id = `cell-${r}-${t}`;
            
            cell.innerHTML = `
                <span class="pick-number">R${r+1} (P${(r * totalTeams) + t + 1})</span>
                <div class="cell-content" id="content-${r}-${t}"></div>
            `;
            grid.appendChild(cell);
        }
    }
}

        function renderState(state) {
            if (!state) return;
            
            currentPickIndex = state.currentPickIndex || 0;
            picks = state.picks || [];
            if (state.teams) teams = state.teams;

            const headers = document.querySelectorAll('.team-header');
            headers.forEach((h, idx) => {
                if (teams[idx] && h.innerText !== teams[idx] && document.activeElement !== h) {
                    h.innerText = teams[idx];
                }
            });

            // Reset board visuals
            for (let r = 0; r < totalRounds; r++) {
                for (let t = 0; t < totalTeams; t++) {
                    const cell = document.getElementById(`cell-${r}-${t}`);
                    const content = document.getElementById(`content-${r}-${t}`);
                    if (cell) cell.className = 'draft-cell';
                    if (content) content.innerHTML = '';
                }
            }

            // Populate picks
            picks.forEach((pick, index) => {
                const { round, col } = getRowAndCol(index + 1);
                const cellElement = document.getElementById(`cell-${round}-${col}`);
                const contentDiv = document.getElementById(`content-${round}-${col}`);
                
                if (cellElement && contentDiv) {
                    cellElement.classList.add('filled', `fill-${pick.position.toLowerCase()}`);
                    contentDiv.innerHTML = `
                        <div class="player-info">${pick.name}</div>
                        <span class="pos-badge">${pick.position}</span>
                    `;
                }
            });

            updateConsole();
        }

async function updateTeamName(index, newName) {
    const cleanedName = newName.trim();
    if (!cleanedName) return;
    
    teams[index] = cleanedName;
    
    // Immediately update the console banner if it's this team's turn
    updateConsole();
    
    // Sync to cloud and broadcast to other tabs
    await syncStateToCloud();
    draftChannel.postMessage({ currentPickIndex, picks, teams });
}

async function updateTeamName(index, newName) {
    teams[index] = newName.trim();
    renderState({ currentPickIndex, picks, teams });
    await syncStateToCloud();
    draftChannel.postMessage({ currentPickIndex, picks, teams });
}
        async function fetchStateFromCloud() {
            try {
                const res = await fetch(`${WORKER_URL}/api/state`);
                const state = await res.json();
                if (state && state.currentPickIndex !== undefined) {
                    if (state.currentPickIndex !== currentPickIndex || state.picks.length !== picks.length) {
                        renderState(state);
                    }
                }
            } catch (err) {
                console.error("Error fetching state:", err);
            }
        }

        async function syncStateToCloud() {
            const payload = { currentPickIndex, picks, teams };
            try {
                await fetch(`${WORKER_URL}/api/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Error syncing state:", err);
            }
        }

        function filterPlayers() {
            const query = document.getElementById('player-search').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('autocomplete-results');
            resultsContainer.innerHTML = '';

            if (!query) return;

            const draftedNames = new Set(picks.map(p => p.name));
            const filtered = playerPool.filter(p => 
                !draftedNames.has(p.name) && 
                (p.name.toLowerCase().includes(query) || p.pos.toLowerCase() === query)
            ).slice(0, 15);

            filtered.forEach(player => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                item.innerHTML = `<span><strong>${player.name}</strong> (${player.team})</span> <span class="item-meta">${player.pos}</span>`;
                item.onclick = () => selectPlayer(player);
                resultsContainer.appendChild(item);
            });
        }

        function selectPlayer(player) {
            selectedPlayer = player;
            document.getElementById('player-search').value = `${player.name} (${player.team})`;
            document.getElementById('autocomplete-results').innerHTML = '';

            document.getElementById('selected-preview').innerHTML = `
                <span><strong>${player.name}</strong> (${player.team})</span>
                <span class="pos-badge">${player.pos}</span>
            `;
            document.getElementById('submit-btn').disabled = false;
        }

     function getRowAndCol(pickNum) {
    const zeroBased = pickNum - 1;
    const round = Math.floor(zeroBased / totalTeams);
    const rawCol = zeroBased % totalTeams;
    
    // Snake formatting: Even rounds (0, 2, 4...) go left-to-right (0 to 11).
    // Odd rounds (1, 3, 5...) go right-to-left (11 down to 0).
    const col = (round % 2 === 0) ? rawCol : (totalTeams - 1 - rawCol);
    return { round, col };
}
        function updateConsole() {
            const undoBtn = document.getElementById('undo-btn');
            undoBtn.disabled = picks.length === 0;

            if (currentPickIndex >= totalTeams * totalRounds) {
                document.getElementById('display-pick-num').innerText = "DONE";
                document.getElementById('display-on-clock').innerText = "Draft Complete!";
                document.getElementById('player-search').disabled = true;
                return;
            }

            document.getElementById('player-search').disabled = false;
            const currentPickNum = currentPickIndex + 1;
            document.getElementById('display-pick-num').innerText = currentPickNum;

            const { round, col } = getRowAndCol(currentPickNum);
            document.getElementById('display-on-clock').innerText = teams[col];
        }

        async function makePick() {
            if (!selectedPlayer || currentPickIndex >= totalTeams * totalRounds) return;

            picks.push({
                name: selectedPlayer.name,
                position: selectedPlayer.pos,
                team: selectedPlayer.team,
                draftedBy: teams[getRowAndCol(currentPickIndex + 1).col]
            });

            currentPickIndex++;

            selectedPlayer = null;
            document.getElementById('player-search').value = '';
            document.getElementById('selected-preview').innerHTML = '<span style="color: var(--text-muted);">No player selected</span>';
            document.getElementById('submit-btn').disabled = true;

            renderState({ currentPickIndex, picks, teams });
            await syncStateToCloud();
            
            // Broadcast update to other local tabs instantly
            draftChannel.postMessage({ currentPickIndex, picks, teams });
        }

        async function undoLastPick() {
            if (picks.length === 0) return;

            // Remove the latest pick and roll back index
            picks.pop();
            currentPickIndex = Math.max(0, currentPickIndex - 1);

            selectedPlayer = null;
            document.getElementById('player-search').value = '';
            document.getElementById('selected-preview').innerHTML = '<span style="color: var(--text-muted);">No player selected</span>';
            document.getElementById('submit-btn').disabled = true;

            renderState({ currentPickIndex, picks, teams });
            await syncStateToCloud();
            
            // Broadcast update to other local tabs instantly
            draftChannel.postMessage({ currentPickIndex, picks, teams });
        }

        window.onload = async () => {
            buildGridStructure();
            await fetchStateFromCloud();
            // Poll the cloud every 1 second for separate devices
            setInterval(fetchStateFromCloud, 1000);
        };
    </script>
</body>
</html>
